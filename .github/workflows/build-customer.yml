name: Build & Verify Customer Mobile App

on:
  push:
    branches: [ main ]
    paths:
      - 'customer/**'
      - '.github/workflows/build-customer.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'customer/**'

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./customer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: customer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Export web bundle test
        run: npx expo export --platform web
